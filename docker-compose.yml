services:
  cold-storage-review-api:
    build: .
    image: cold-storage-review-api:1.1.0
    container_name: cold-storage-review-api
    # 宿主机端口可用环境变量 HOST_PORT 覆盖，默认 8000；容器内固定监听 8000。
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
